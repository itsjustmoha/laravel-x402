name: release

# Tags and releases the newest dated version in CHANGELOG.md ("## [x.y.z] - YYYY-MM-DD")
# once the tests workflow has passed for that commit on main. See CONTRIBUTING.md.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find the version to release
        id: version
        run: |
          version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$/\1/p' CHANGELOG.md | head -n 1)

          if [ -z "$version" ]; then
            echo "No dated version in CHANGELOG.md, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "v$version" | sort -V | tail -n 1)" != "v$version" ]; then
            echo "::error::CHANGELOG.md version v$version is not newer than the latest tag $latest."
            exit 1
          fi

          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"

          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::The CHANGELOG.md section for $version is empty."
            exit 1
          fi

          echo "Releasing v$version (latest tag: ${latest:-none})."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
